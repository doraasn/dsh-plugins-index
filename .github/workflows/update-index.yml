name: update-market-index

on:
  # 手动触发
  workflow_dispatch:
  # 每天 03:00 UTC（北京时间 11:00）兜底跑一次
  schedule:
    - cron: '0 3 * * *'
  # 别的仓库发版后可以用 repository_dispatch 通知
  repository_dispatch:
    types: [plugin-release]

permissions:
  contents: write

# 同一时刻只跑一个：并发重建会双双 commit，后推的那个被拒（实测 2026-11-05）
concurrency:
  group: update-market-index
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild market-index.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-index.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- market-index.json; then
            echo "索引无变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-index.json
          git commit -m "chore: 自动更新插件市场索引"
          # 并发/远端抢先提交时 rebase 后重试，避免整轮 run 因为 push 被拒而失败
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin main; then
              exit 0
            fi
            echo "push 失败，第 $i 次重试"
            sleep 5
          done
          echo "push 重试 3 次仍失败"
          exit 1
